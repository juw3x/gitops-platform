apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.1.1
      helm:
        releaseName: monitoring
        values: |
          grafana:
            adminPassword: prometheus
            persistence:
              enabled: true
              size: 5Gi
          prometheus:
            prometheusSpec:
              retention: 7d
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
          alertmanager:
            enabled: true
          nodeExporter:
            enabled: true
          kubeStateMetrics:
            enabled: true
    - repoURL: git@github.com:juw3x/gitops-platform.git
      targetRevision: HEAD
      path: monitoring/extra
